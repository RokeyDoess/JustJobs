# Add another entry under jobs to create a job; no code changes are needed.
# Keep its ID stable: player progress is stored against that ID.
# Activities: block-break, craft, block-place, crop-harvest, breed, fish, mob-kill,
# player-kill, trade, travel, sail, enchant.
# A rule matches materials or entities, depending on its activity. '*' matches any.
# Each rule's description names its reward unit in the menu; edit it to suit your selectors.
# Material tags such as '#minecraft:logs' are supported for block-break rules.
# The entity selector '#hostile' matches mobs classified by Paper as enemies.
# Trade units are emeralds paid to villagers; travel/sail units are blocks traveled.
# Enchant units are XP levels spent (1, 2, or 3), not the displayed level requirement.
# Other activities award once per block, kill, harvest, animal bred, or catch.
# Crop harvests count mature broken crops or a successful berry harvest, not planting.
# Placement jobs share one reward per world location, even across players and block types.
# Craft rewards are per output item actually crafted in a player's crafting grid.
# Automatic crafters and stonecutters do not count. Avoid reversible recipes and recoloring loops.
# Fish rules select caught item materials; breed rules select the offspring's entity type.
# Matching rules add together, including rules in different jobs. Avoid unintended overlap.
# Optional progression overrides: first-level-xp, early-level-xp, early-level,
# plateau-xp, plateau-level, xp-multiplier (1 = normal, 2 = twice the XP required).
# distance-per-reward batches travel XP and money; rule rates are still per block.
# Optional hourly-income-limit overrides the shared money cap; 0 means unlimited.
# natural-only defaults to true for block jobs. False allows grown/generated blocks;
# hand-placed blocks are still excluded.
# Travel pays a smaller bonus. Each job is capped at 100 per hour by default.
config-version: 8
jobs:
  digging:
    name: Digging
    icon: IRON_SHOVEL
    color: YELLOW
    description: Dig natural soil and sand.
    enabled: true
    natural-only: true
    rules:
      - activity: block-break
        description: soil or sand block
        materials: [DIRT, GRASS_BLOCK, COARSE_DIRT, ROOTED_DIRT, PODZOL, MYCELIUM, MUD, CLAY, SAND, RED_SAND, GRAVEL, SOUL_SAND, SOUL_SOIL]
        xp: 1
        money: '0.0085'
  mining:
    name: Mining
    icon: IRON_PICKAXE
    color: BLUE
    description: Mine natural stone and ore.
    enabled: true
    natural-only: true
    rules:
      - activity: block-break
        description: stone block
        materials: [STONE, DEEPSLATE, GRANITE, DIORITE, ANDESITE, TUFF, CALCITE, NETHERRACK, BLACKSTONE, BASALT, END_STONE]
        xp: 1
        money: '0.0075'
      - activity: block-break
        description: common ore (coal, copper, Nether ores)
        materials: [COAL_ORE, DEEPSLATE_COAL_ORE, COPPER_ORE, DEEPSLATE_COPPER_ORE, NETHER_GOLD_ORE, NETHER_QUARTZ_ORE]
        xp: 5
        money: '0.03'
      - activity: block-break
        description: iron, gold, redstone or lapis ore
        materials: [IRON_ORE, DEEPSLATE_IRON_ORE, GOLD_ORE, DEEPSLATE_GOLD_ORE, REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE, LAPIS_ORE, DEEPSLATE_LAPIS_ORE]
        xp: 5
        money: '0.10'
      - activity: block-break
        description: rare ore (diamond, emerald, ancient debris)
        materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, ANCIENT_DEBRIS]
        xp: 5
        money: '0.50'
  treefelling:
    name: Treefelling
    icon: IRON_AXE
    color: GREEN
    description: Chop natural and player-grown trees.
    enabled: true
    natural-only: false
    rules:
      - activity: block-break
        description: log
        materials: ['#minecraft:logs', '#minecraft:crimson_stems', '#minecraft:warped_stems']
        xp: 2
        money: '0.075'
  hunting:
    name: Hunting
    icon: BOW
    color: RED
    description: Hunt hostile mobs.
    enabled: true
    rules:
      - activity: mob-kill
        description: hostile mob killed
        entities: ['#hostile']
        xp: 5
        money: '0.40'
  dueling:
    name: Dueling
    icon: IRON_SWORD
    color: RED
    description: Defeat other players.
    enabled: true
    progression:
      first-level-xp: 10
      xp-multiplier: 1
    rules:
      - activity: player-kill
        description: player kill
        xp: 10
        money: '5'
  trading:
    name: Trading
    icon: EMERALD
    color: GREEN
    description: Spend emeralds with villagers.
    enabled: true
    rules:
      - activity: trade
        description: emerald spent
        xp: 1
        money: '0.10'
  exploring:
    name: Exploring
    icon: COMPASS
    color: PURPLE
    description: Explore on foot.
    enabled: true
    distance-per-reward: 500
    rules:
      - activity: travel
        description: blocks walked
        xp: 0.01
        money: '0.001'
  sailing:
    name: Sailing
    icon: OAK_BOAT
    color: BLUE
    description: Travel by boat on water.
    enabled: true
    distance-per-reward: 500
    rules:
      - activity: sail
        description: blocks sailed
        xp: 0.01
        money: '0.0005'
  enchanting:
    name: Enchanting
    icon: ENCHANTING_TABLE
    color: PINK
    description: Enchant items at an enchanting table.
    enabled: true
    rules:
      - activity: enchant
        description: enchanting level spent
        xp: 10
        money: '0.50'
  farming:
    name: Farming
    icon: IRON_HOE
    color: GREEN
    description: Harvest mature crops and breed animals.
    enabled: true
    rules:
      - activity: crop-harvest
        description: mature crop or berry harvest
        materials: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA, SWEET_BERRY_BUSH, CAVE_VINES, CAVE_VINES_PLANT]
        xp: 1
        money: '0.02'
      - activity: breed
        description: animal bred
        entities: ['*']
        xp: 5
        money: '0.50'
  fishing:
    name: Fishing
    icon: FISHING_ROD
    color: BLUE
    description: Catch fish and other items with a fishing rod.
    enabled: true
    rules:
      - activity: fish
        description: successful catch
        materials: ['*']
        xp: 5
        money: '0.25'
  engineering:
    name: Engineering
    icon: PISTON
    color: RED
    description: Craft redstone components and railway blocks.
    enabled: true
    rules:
      - activity: craft
        description: redstone torch, repeater, tripwire hook or rail crafted
        materials: [REDSTONE_TORCH, REPEATER, RAIL, TRIPWIRE_HOOK]
        xp: 1
        money: '0.02'
      - activity: craft
        description: powered, detector or activator rail crafted
        materials: [POWERED_RAIL, DETECTOR_RAIL, ACTIVATOR_RAIL]
        xp: 2
        money: '0.05'
      - activity: craft
        description: component crafted (piston, hopper, observer, etc.)
        materials: [PISTON, STICKY_PISTON, OBSERVER, COMPARATOR, DISPENSER, DROPPER, HOPPER, REDSTONE_LAMP, DAYLIGHT_DETECTOR, TARGET, CRAFTER]
        xp: 3
        money: '0.15'
  building:
    name: Building
    icon: BRICKS
    color: YELLOW
    description: Craft brickwork, bookshelves, flower pots and jack o'lanterns.
    enabled: true
    rules:
      - activity: craft
        description: brickwork, bookshelf, flower pot or jack o'lantern crafted
        materials: [BRICKS, STONE_BRICKS, MUD_BRICKS, NETHER_BRICKS, RED_NETHER_BRICKS, END_STONE_BRICKS, PURPUR_BLOCK, DEEPSLATE_TILES, TUFF_BRICKS, POLISHED_BLACKSTONE_BRICKS, BOOKSHELF, FLOWER_POT, JACK_O_LANTERN]
        xp: 1
        money: '0.015'
