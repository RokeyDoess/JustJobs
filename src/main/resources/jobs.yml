        money: '0.02'
      - activity: breed
        description: animal bred
        entities: ['*']
        xp: 5
        money: '0.50'
      - activity: shear
        description: sheep sheared
        entities: [SHEEP]
        xp: 1
        money: '0.025'
      - activity: beehive-harvest
